# BiMark under /bimark — injected between # BEGIN bimark / # END bimark
# Placeholders: __APP_DIR__ __FE_PORT__ __BE_PORT__ __BASE_PATH__
#
# Does NOT claim domain root (gardenhouse may already use /).

    # --- BiMark Django API (strip /bimark) ---
    location ^~ __BASE_PATH__/api/ {
        proxy_pass http://127.0.0.1:__BE_PORT__/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- BiMark Django Admin ---
    location ^~ __BASE_PATH__/admin/ {
        proxy_pass http://127.0.0.1:__BE_PORT__/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- BiMark static ---
    location ^~ __BASE_PATH__/static/ {
        alias __APP_DIR__/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- BiMark media ---
    location ^~ __BASE_PATH__/media/ {
        alias __APP_DIR__/backend/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- BiMark Next.js (basePath + next-intl ru|en|es) ---
    location ^~ __BASE_PATH__ {
        proxy_pass http://127.0.0.1:__FE_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
