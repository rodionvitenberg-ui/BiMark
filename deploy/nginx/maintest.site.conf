# maintest.site — minimal server shell when no vhost exists yet.
# BiMark locations are injected as # BEGIN bimark … # END bimark by install/deploy.
# If gardenhouse already owns this domain conf, scripts upsert into the existing file
# and do NOT replace the whole server (root → gardenhouse stays intact).

server {
    listen 80;
    listen [::]:80;
    server_name maintest.site www.maintest.site 193.181.216.124;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # BEGIN bimark
    # (locations filled by deploy scripts from bimark.locations.conf)
    # END bimark
}
